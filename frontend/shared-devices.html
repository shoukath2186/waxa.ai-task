<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Devices - Nexus Fraud Analyzer</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="shared-devices">
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon"></div>
                <h1>Nexus</h1>
            </div>
            <p class="subtitle">Fraud Analytics Engine</p>
            
            <nav class="nav-menu">
                <a href="/" class="nav-btn" style="text-decoration: none;">Dashboard</a>
                <a href="/fraud-rings" class="nav-btn" style="text-decoration: none;">Fraud Rings</a>
                <a href="/shared-devices" class="nav-btn active" style="text-decoration: none;">Shared Devices</a>
            </nav>

            <div class="stats-card">
                <h3>Database Status</h3>
                <div class="stat">
                    <span class="label">Nodes</span>
                    <span class="value" id="node-count">...</span>
                </div>
                <div class="stat">
                    <span class="label">Relationships</span>
                    <span class="value" id="rel-count">...</span>
                </div>
                <div class="status-indicator online">
                    <span class="dot"></span> Connected to CognoDB
                </div>
            </div>
        </aside>

        <main class="content">
            <header>
                <h2>Graph Database Analysis</h2>
                <div class="user-profile">Analyst Mode</div>
            </header>

            <div class="view-section active">
                <div class="section-header">
                    <h2>Suspicious Device Sharing</h2>
                    <p>Multiple distinct users accessing bank accounts from the same device.</p>
                </div>
                <div id="shared-devices-container" class="cards-grid">
                    <div class="loading-state">Analyzing graph data...</div>
                </div>
            </div>
        </main>
    </div>

    <script src="/app.js"></script>
</body>
</html>
